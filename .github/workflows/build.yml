# Builds the Dockerfile and pushes it to GHCR. PESDE_TAG comes from the Dockerfile.
name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned version from Dockerfile
        run: |
          tag=$(sed -n 's/^ARG PESDE_TAG=//p' Dockerfile)
          test -n "$tag"
          echo "PESDE_TAG=$tag" >> "$GITHUB_ENV"
          echo "REGISTRY_VERSION=${tag##*registry.}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PESDE_TAG=${{ env.PESDE_TAG }}
          tags: |
            ghcr.io/wobletstudios/pesde-registry:${{ env.REGISTRY_VERSION }}
            ghcr.io/wobletstudios/pesde-registry:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
